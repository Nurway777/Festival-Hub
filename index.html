<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Festival Hub</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#0b0a14;--bg2:#14122a;--tx:#f3f1ff;--mu:#9a96b8;--gl:rgba(255,255,255,.06);--bd:rgba(255,255,255,.1);--a:#8b5cf6;--b:#ec4899;--c:#22d3ee;--g:linear-gradient(135deg,#8b5cf6,#ec4899 60%,#f59e0b);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root:not([data-theme="dark"]):not([data-theme="light"]){}


:root[data-theme="light"]{--bg:#f6f4ff;--bg2:#fff;--tx:#1b1740;--mu:#6a6590;--gl:rgba(255,255,255,.7);--bd:rgba(80,60,160,.15)}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 "Segoe UI",system-ui,-apple-system,sans-serif;min-height:100vh;overflow-x:hidden}
body:before,body:after{content:"";position:fixed;width:50vmax;height:50vmax;border-radius:50%;filter:blur(90px);opacity:.28;z-index:-1;animation:fl 18s ease-in-out infinite alternate}
body:before{background:var(--a);top:-20vmax;left:-15vmax}body:after{background:var(--b);bottom:-25vmax;right:-15vmax;animation-delay:-9s}
@keyframes fl{to{transform:translate(8vmax,6vmax) scale(1.15)}}
h1,h2,h3{font-family:Georgia,"Times New Roman",serif;margin:0;letter-spacing:-.01em}
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:-1;pointer-events:none}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:6px;padding:10px 18px;background:var(--gl);backdrop-filter:blur(16px);border-bottom:1px solid var(--bd);overflow-x:auto}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;margin-right:auto;white-space:nowrap}
.brand img{width:32px;height:32px;border-radius:9px;object-fit:cover}
.tab{background:none;border:0;color:var(--mu);padding:8px 13px;border-radius:99px;cursor:pointer;font:inherit;white-space:nowrap;transition:.2s}
.tab:hover{color:var(--tx);background:var(--gl)}.tab.on{background:var(--g);color:#fff}
main{max-width:1100px;margin:0 auto;padding:22px 18px 70px;animation:in .4s}
@keyframes in{from{opacity:0;transform:translateY(10px)}}
.hero{position:relative;border-radius:28px;overflow:hidden;padding:clamp(34px,8vw,90px) clamp(20px,5vw,60px);border:1px solid var(--bd);background:var(--gl);backdrop-filter:blur(14px);text-align:center;background-size:cover;background-position:center}
.hero:before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(11,10,20,.35),rgba(11,10,20,.8))}
.hero>*{position:relative}.hero.noimg:before{background:none}
.hero h1{font-size:clamp(34px,7vw,68px);line-height:1.05;background:var(--g);-webkit-background-clip:text;background-clip:text;color:transparent;margin-bottom:14px}
.hero p{max-width:600px;margin:0 auto 24px;color:var(--mu);font-size:17px}
.hero.img p{color:#e8e5ff}
.btn{border:0;cursor:pointer;font:inherit;font-weight:600;padding:10px 20px;border-radius:99px;color:#fff;background:var(--g);transition:.2s;box-shadow:0 8px 24px -8px var(--a)}
.btn:hover{transform:translateY(-2px)}.btn.o{background:var(--gl);color:var(--tx);border:1px solid var(--bd);box-shadow:none}
.btn.d{background:#e11d48}.btn.s{padding:6px 13px;font-size:13px}
.stats,.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));margin:20px 0}
.card{background:var(--gl);border:1px solid var(--bd);border-radius:20px;padding:18px;backdrop-filter:blur(12px);transition:.25s}
.card:hover{transform:translateY(-4px);border-color:var(--a);box-shadow:0 20px 50px -20px var(--a),0 0 0 1px rgba(139,92,246,.25)}
.btn{position:relative;overflow:hidden}.btn:after{content:"";position:absolute;top:0;left:-120%;width:60%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.35),transparent);transition:left .6s}.btn:hover:after{left:140%}
h2{position:relative;display:inline-block}h2:after{content:"";display:block;height:3px;width:46%;margin-top:4px;border-radius:9px;background:var(--g)}
.card .im{width:calc(100% + 36px);margin:-18px -18px 12px;height:150px;object-fit:cover;border-radius:20px 20px 0 0;display:block}
.stat b{font-size:30px;display:block;background:var(--g);-webkit-background-clip:text;background-clip:text;color:transparent}.stat span{color:var(--mu);font-size:13px}
.sec{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:26px 0 6px}
.mu{color:var(--mu);font-size:13px}.pill{display:inline-block;padding:2px 10px;border-radius:99px;font-size:12px;background:var(--gl);border:1px solid var(--bd);margin:2px 4px 2px 0}
.pill.ok{color:#34d399}.pill.no{color:#fb7185}
.lb{display:flex;align-items:center;gap:14px;padding:12px 16px;margin:8px 0}
.rk{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;font-weight:800;background:var(--gl);border:1px solid var(--bd);flex:none}
.r1 .rk{background:linear-gradient(135deg,#fbbf24,#f59e0b);color:#3b2400}.r2 .rk{background:linear-gradient(135deg,#e5e7eb,#9ca3af);color:#222}.r3 .rk{background:linear-gradient(135deg,#f59e0b,#b45309);color:#fff}
.r1{border-color:#fbbf24;box-shadow:0 0 30px -10px #fbbf24}
.av{width:44px;height:44px;border-radius:50%;background:var(--g);display:grid;place-items:center;font-weight:700;color:#fff;object-fit:cover;flex:none}
.pts{margin-left:auto;font-weight:800;font-size:20px}
input,select,textarea{width:100%;background:var(--bg2);color:var(--tx);border:1px solid var(--bd);border-radius:12px;padding:10px 12px;font:inherit;margin-top:4px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--a)}
label{display:block;font-size:13px;color:var(--mu);margin-bottom:12px}label.ck{display:flex;gap:8px;align-items:center}label.ck input{width:auto;margin:0}
.bar{display:flex;gap:10px;flex-wrap:wrap}.bar input,.bar select{flex:1;min-width:140px;margin:0}
.md{position:fixed;inset:0;z-index:50;background:rgba(5,4,12,.7);backdrop-filter:blur(6px);display:grid;place-items:center;padding:16px;animation:in .2s}
.md>div{background:var(--bg2);border:1px solid var(--bd);border-radius:24px;padding:24px;width:min(520px,100%);max-height:90vh;overflow:auto}
.md h3{margin-bottom:14px}.row{display:flex;gap:10px;justify-content:flex-end;margin-top:12px}
#toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);z-index:99;display:flex;flex-direction:column;gap:8px}
.t{background:var(--bg2);border:1px solid var(--bd);padding:10px 18px;border-radius:14px;animation:in .3s;box-shadow:0 10px 30px rgba(0,0,0,.4)}.t.e{border-color:#e11d48}
.empty{text-align:center;padding:40px 20px;color:var(--mu);border:1px dashed var(--bd);border-radius:20px;margin:14px 0}
.sk{height:90px;border-radius:20px;background:linear-gradient(90deg,var(--gl),var(--bd),var(--gl));background-size:200% 100%;animation:sh 1.2s infinite}@keyframes sh{to{background-position:-200% 0}}
.prev{max-width:100%;max-height:140px;border-radius:12px;margin-top:6px}
.g .card{padding:0;overflow:hidden}.g .im{margin:0;width:100%;height:190px;border-radius:0}.g .cap{padding:12px 16px}
.act{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
footer{text-align:center;color:var(--mu);padding:30px 18px;font-size:13px}
#splash{position:fixed;inset:0;z-index:200;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;text-align:center;padding:20px;transition:opacity .7s,visibility .7s}
#splash.out{opacity:0;visibility:hidden}
#splash img{width:clamp(120px,30vw,180px);height:clamp(120px,30vw,180px);object-fit:contain;border-radius:28px;animation:pop 1s cubic-bezier(.2,1.4,.4,1) both,bob 3s 1s ease-in-out infinite;filter:drop-shadow(0 18px 40px var(--a))}
#splash h1{font-size:clamp(30px,8vw,64px);background:linear-gradient(90deg,#8b5cf6,#ec4899,#f59e0b,#8b5cf6);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:rise .9s .3s both,flow 3s linear infinite}
#splash i{width:140px;height:3px;border-radius:9px;background:var(--g);animation:ld 2.2s ease-out both}
@keyframes pop{from{opacity:0;transform:scale(.5) rotate(-8deg)}}@keyframes bob{50%{transform:translateY(-10px)}}
@keyframes rise{from{opacity:0;transform:translateY(24px);letter-spacing:.3em}}@keyframes flow{to{background-position:-300% 0}}@keyframes ld{from{width:0}}
@media(max-width:600px){nav{padding:8px 10px}.lb{padding:10px}}
</style></head><body>
<div id="splash"><div id="sp"></div><i></i></div><canvas id="bg"></canvas><nav id="nav"></nav><main id="app"><div class="sk"></div></main><footer id="ft"><div class="card" style="max-width:520px;margin:0 auto;padding:16px 20px"><b>Want to buy this website?</b><div class="mu" style="margin-top:4px">Contact with owner</div><div style="margin-top:8px">✉️ <span style="color:var(--c);user-select:all">wayall171@gmail.com</span> <button class="btn o s" onclick="cp('wayall171@gmail.com')">Copy</button></div></div></footer><div id="toast"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const $=(s,e=document)=>e.querySelector(s),esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let db=null,assets=null,admin=false,isEd=false,tab="home",S={settings:{},students:[],points:[],events:[],gallery:[],news:[],cats:[],teams:[],cands:[]},ready=false,flt={};
const COLS=["students","points","events","gallery","news","cats","teams","cands","settings"];
function toast(m,e){const d=document.createElement("div");d.className="t"+(e?" e":"");d.textContent=m;$("#toast").append(d);setTimeout(()=>d.remove(),3200)}
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const today=()=>new Date().toISOString().slice(0,10);
const img=id=>id?(String(id).startsWith("data:image/")?id:`/_blob/${esc(id)}`):"";
async function save(col,id,data,act){try{await db.collection(col).doc(id).set({...data,updated:Date.now()});log(act)}catch(e){toast(e.message||"Save failed",1)}}
async function del(col,id,act){try{await db.collection(col).doc(id).delete();log(act)}catch(e){toast(e.message||"Delete failed",1)}}
function log(a){if(!a)return;toast(a);db.collection("logs").doc(uid()).set({a,t:Date.now()}).catch(()=>{})}
function confirmBox(msg,fn){modal(`<h3>Please confirm</h3><p>${esc(msg)}</p><div class="row"><button class="btn o" data-x>Cancel</button><button class="btn d" id="cf">Confirm Delete</button></div>`);$("#cf").onclick=()=>{closeM();fn()}}
function modal(h){closeM();const m=document.createElement("div");m.className="md";m.innerHTML=`<div>${h}</div>`;m.onclick=e=>{if(e.target===m||e.target.dataset.x!==undefined)closeM()};document.body.append(m)}
function closeM(){document.querySelectorAll(".md").forEach(m=>m.remove())}
async function shrink(f){const b=await createImageBitmap(f);let sc=Math.min(1,3000/Math.max(b.width,b.height)),bl;const t=f.type==="image/png"?"image/png":"image/jpeg";do{const c=document.createElement("canvas");c.width=Math.max(1,b.width*sc|0);c.height=Math.max(1,b.height*sc|0);c.getContext("2d").drawImage(b,0,0,c.width,c.height);bl=await new Promise(r=>c.toBlob(r,t,.9));sc*=.75}while(bl&&bl.size>1.9e7&&sc>.05);return new File([bl],f.name,{type:t})}
async function up(file){if(!assets)throw Error("Uploads unavailable");if(!/^image\/(png|jpe?g|webp|svg\+xml)$/.test(file.type))throw Error("Use PNG, JPG, WEBP or SVG");if(file.size>8e6&&file.type!=="image/svg+xml"){try{file=await shrink(file)}catch(e){throw Error("Could not process this image")}}if(file.size>2e7)throw Error("Image too large (max 20 MB)");return (await assets.upload(file)).id}
// generic form
function form(title,fields,val,onSave,multi){
 val={...val};
 const f=fields.map(x=>{const v=val[x.k]??"";let i;
  if(x.t==="area")i=`<textarea name="${x.k}" rows="3">${esc(v)}</textarea>`;
  else if(x.t==="sel")i=`<select name="${x.k}">${x.o().map(o=>`<option value="${esc(o[0])}" ${o[0]==v?"selected":""}>${esc(o[1])}</option>`)}</select>`;
  else if(x.t==="img")i=`<input type="file" name="${x.k}" accept="image/png,image/jpeg,image/webp,image/svg+xml" ${multi&&x.k==="img"?"multiple":""}>${v?`<img class="prev cur" src="${img(v)}">`:""}<img class="prev" hidden>${v&&x.rm?`<input type="hidden" name="rm_${x.k}" value=""><button type="button" class="btn d s" style="margin-top:8px" onclick="rmImg(this)">🗑 Delete this image</button><span class="mu rmn" hidden> Image will be deleted when you press Save. You can also choose a new image above.</span>`:""}`;
  else if(x.t==="ck")return `<label class="ck"><input type="checkbox" name="${x.k}" ${v?"checked":""}> ${x.l}</label>`;
  else i=`<input name="${x.k}" type="${x.t||"text"}" value="${esc(v)}" ${x.r?"required":""}>`;
  return `<label>${x.l}${x.r?" *":""}${i}</label>`}).join("");
 modal(`<h3>${title}</h3><form id="fm">${f}<div class="row"><button type="button" class="btn o" data-x>Cancel</button><button class="btn" id="sv">Save</button></div></form>`);
 $("#fm").querySelectorAll("input[type=file]").forEach(i=>i.onchange=()=>{const p=i.parentNode.querySelector("img[hidden]");if(i.files[0]&&p){p.src=URL.createObjectURL(i.files[0]);p.hidden=false}});
 $("#fm").onsubmit=async e=>{e.preventDefault();const b=$("#sv");b.disabled=true;b.textContent="Saving…";const o={...val};
  try{for(const x of fields){const el=$("#fm").elements[x.k];if(x.t==="img"){const rm=$("#fm").elements["rm_"+x.k];if(rm&&rm.value==="1"&&!el.files.length){if(o[x.k]&&assets)assets.delete(o[x.k]).catch(()=>{});o[x.k]=""}else if(el.files.length){if(multi){o._files=[...el.files]}else{if(x.rm&&o[x.k]&&assets)assets.delete(o[x.k]).catch(()=>{});o[x.k]=await up(el.files[0])}}}else if(x.t==="ck")o[x.k]=el.checked;else o[x.k]=x.t==="number"?Number(el.value):el.value}
   await onSave(o,b);closeM()}catch(er){toast(er.message,1);b.disabled=false;b.textContent="Save"}}}
const teamOpts=()=>[["","— no team —"],...S.teams.map(c=>[c.name,c.name])];
const catOpts=()=>[["","— none —"],...S.cats.map(c=>[c.name,c.name])];
const stuOpts=()=>S.students.filter(s=>s.status!=="deleted").map(s=>[s.id,`${s.name} (${s.sid||"-"})`]);
const E={
 students:{l:"Student",f:[{k:"name",l:"Name",r:1},{k:"sid",l:"Student ID",r:1},{k:"user",l:"Username / access ID"},{k:"team",l:"Team",t:"sel",o:teamOpts},{k:"cls",l:"Class"},{k:"sec",l:"Section"},{k:"photo",l:"Profile image",t:"img",rm:1},{k:"status",l:"Status",t:"sel",o:()=>[["active","Active"],["inactive","Inactive"]]}]},
 events:{l:"Event",f:[{k:"name",l:"Event name",r:1},{k:"cat",l:"Category",t:"sel",o:catOpts},{k:"desc",l:"Description",t:"area"},{k:"date",l:"Date",t:"date"},{k:"st",l:"Start time",t:"time"},{k:"en",l:"End time",t:"time"},{k:"venue",l:"Venue"},{k:"max",l:"Max participants",t:"number"},{k:"pts",l:"Points",t:"number"},{k:"img",l:"Event image",t:"img"},{k:"pub",l:"Published",t:"ck"}]},
 news:{l:"Announcement",f:[{k:"title",l:"Title",r:1},{k:"desc",l:"Description",t:"area"},{k:"date",l:"Date",t:"date"},{k:"prio",l:"Priority",t:"sel",o:()=>[["normal","Normal"],["high","High"],["low","Low"]]},{k:"img",l:"Image",t:"img"},{k:"pub",l:"Published",t:"ck"}]},
 gallery:{l:"Gallery image",f:[{k:"title",l:"Title"},{k:"cap",l:"Caption"},{k:"desc",l:"Description",t:"area"},{k:"cat",l:"Category",t:"sel",o:catOpts},{k:"date",l:"Date",t:"date"},{k:"img",l:"Image file",t:"img"},{k:"pub",l:"Published",t:"ck"}]},
 teams:{l:"Team",f:[{k:"name",l:"Team name",r:1}]},
 cats:{l:"Category",f:[{k:"name",l:"Category name",r:1}]},
 points:{l:"Point transaction",f:[{k:"stu",l:"Student",t:"sel",o:stuOpts},{k:"pts",l:"Points",t:"number",r:1},{k:"reason",l:"Reason / event",r:1},{k:"desc",l:"Description",t:"area"},{k:"date",l:"Date",t:"date"}]}
};
function edit(col,rec){
 const c=E[col],isNew=!rec;rec=rec||{id:uid(),date:today(),pub:true,status:"active",pts:0};
 if(col==="students"&&!isNew){}
 form((isNew?"Add ":"Edit ")+c.l,c.f,rec,async o=>{
  if(col==="students"&&S.students.some(s=>s.id!==o.id&&s.sid&&s.sid===o.sid))throw Error("Duplicate Student ID");
  if(col==="points"&&!o.stu)throw Error("Choose a student");
  if(col==="gallery"&&isNew&&!o.img&&!(o._files&&o._files.length))throw Error("Choose an image file");
  if(col==="teams"){if(S.teams.some(t=>t.id!==o.id&&t.name===o.name))throw Error("Team already exists");if(!isNew&&rec.name!==o.name)for(const st of S.students.filter(x=>x.team===rec.name))await save("students",st.id,{...st,team:o.name})}
  const files=o._files;delete o._files;
  if(col==="gallery"&&isNew&&files){const ids=[];for(let i=0;i<files.length;i++){const b=$("#sv");b.textContent=`Uploading ${i+1}/${files.length}…`;const im=await up(files[i]);await save("gallery",uid(),{...o,img:im,title:o.title||files[i].name.replace(/\.[^.]+$/,"")},i===files.length-1?`${files.length} image(s) uploaded`:null)}return}
  if(files&&files[0])o.img=await up(files[0]);
  await save(col,o.id,o,(isNew?"Created ":"Updated ")+c.l.toLowerCase())
 },col==="gallery"&&isNew)}
function ask(col,r,label){confirmBox(col==="students"?"Are you sure you want to permanently delete this student? (They will be moved to Archived.)":`Delete this ${E[col].l.toLowerCase()}?`,async()=>{
 if(col==="students")await save("students",r.id,{...r,status:"deleted"},"Student archived");
 else{if(col==="events")for(const c of S.cands.filter(c=>c.ev===r.id))await del("cands",c.id);const arr=S[col];S[col]=arr.filter(x=>x.id!==r.id);render(1);try{await db.collection(col).doc(r.id).delete();log("Deleted "+E[col].l.toLowerCase())}catch(e){S[col]=arr;render(1);toast("Could not delete: "+(e.message||"no permission — open this page signed in as the owner"),1);return}if(r.img&&assets&&col==="gallery")assets.delete(r.img).catch(()=>{})}})}
// data
const total=id=>S.points.filter(p=>p.stu===id).reduce((a,p)=>a+(+p.pts||0),0);
function board(){return S.students.filter(s=>s.status==="active").map(s=>({...s,total:total(s.id)})).sort((a,b)=>b.total-a.total||(a.name||"").localeCompare(b.name||"")||a.id.localeCompare(b.id)).map((s,i)=>({...s,rank:i+1}))}
const av=s=>s.photo?`<img class="av" src="${img(s.photo)}">`:`<div class="av">${esc((s.name||"?")[0].toUpperCase())}</div>`;
const sName=id=>(S.students.find(s=>s.id===id)||{}).name||"Removed student";
const empty=(t,b)=>`<div class="empty">${t}${b&&admin?`<br><br>${b}`:""}</div>`;
const pubOnly=a=>admin?a:a.filter(x=>x.pub);
const addBtn=(c,t)=>admin?`<button class="btn s" onclick="edit('${c}')">+ ${t||"Add"}</button>`:"";
const acts=(c,id)=>admin?`<div class="act"><button class="btn o s" onclick="edit('${c}',S['${c}'].find(x=>x.id==='${id}'))">Edit</button><button class="btn d s" onclick="ask('${c}',S['${c}'].find(x=>x.id==='${id}'))">Delete</button></div>`:"";
const search=(ph)=>`<div class="bar"><input id="q" placeholder="${ph}" value="${esc(flt.q||"")}" oninput="flt.q=this.value;render(1)"></div>`;
const qm=(o,keys)=>!flt.q||keys.some(k=>String(o[k]??"").toLowerCase().includes(flt.q.toLowerCase()));
// views
const V={
 home(){const s=S.settings,b=board(),top=b[0];

// Standalone browser adapter: persistent localStorage database + local image data URLs.
(function(){
 const PREFIX="festival_hub_v1:", listeners={};
 const read=c=>{try{return JSON.parse(localStorage.getItem(PREFIX+c)||"{}")}catch(e){return {}}};
 const notify=c=>{const all=read(c),docs=Object.entries(all).map(([id,data])=>({id,data:()=>data}));(listeners[c]||[]).slice().forEach(fn=>fn({docs}))};
 const collection=c=>({
  doc:id=>({
   set:async data=>{const all=read(c);all[id]={...data};localStorage.setItem(PREFIX+c,JSON.stringify(all));notify(c)},
   delete:async()=>{const all=read(c);delete all[id];localStorage.setItem(PREFIX+c,JSON.stringify(all));notify(c)},
   get:async()=>{const all=read(c);return {exists:Object.prototype.hasOwnProperty.call(all,id),data:()=>all[id]||{}}}
  }),
  onSnapshot:(fn)=>{(listeners[c]||(listeners[c]=[])).push(fn);notify(c);return ()=>{listeners[c]=listeners[c].filter(x=>x!==fn)}}
 });
 window.claude={use:async kind=>{
  if(kind==="user")return {canEdit:()=>true};
  if(kind==="db")return {collection};
  if(kind==="assets")return {
   upload:async file=>({id:await new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(String(r.result));r.onerror=reject;r.readAsDataURL(file)})}),
   delete:async()=>{}
  };
  throw new Error("Unsupported service");
 }};
})();
